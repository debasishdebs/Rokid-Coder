org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Rokid Coder application ids: one pair, shared by the phone and glasses apps. Class namespaces stay
# com.anezium.rokidbus.*; the upstream shells in vendor/nexus keep upstream ids.
rokid.phoneApplicationId=io.github.debasishdebs.rokidcoder
rokid.glassesApplicationId=io.github.debasishdebs.rokidcoder.glasses

# The release both apps ship as (scripts/check-versions.mjs holds every other field to it). The
# versionCode is major * 10000 + minor * 100 + patch, as the phone reads a glasses version (R205).
rokid.versionName=1.0.0
rokid.versionCode=10000

# The release key's certificate SHA-256 (keytool -list -v), lowercase hex: a public digest, not a
# secret. One key signs both APKs; the phone pins the bundled glasses APK to it, and every release
# build fails until it is set and matches the NEXUS_RELEASE_* key (rokid.release-signing).
rokid.releaseSignerSha256=0b1bb263707421e5b0f3fff4b44931d9f65bec3d86745e099733a932905399f0
