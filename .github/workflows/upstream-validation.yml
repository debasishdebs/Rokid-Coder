name: Upstream validation

# Builds vendor/nexus standalone, with upstream's own settings.gradle.kts, and runs
# upstream's full test list: the SDK and hubs, and the plugins and Patcher we vendor
# but do not ship. This keeps the vendored tree, with our patches on it, verified
# the way upstream verifies it, so an upstream merge is judged against a green base.

on:
  push:
    paths:
      - "vendor/**"
      - ".github/workflows/upstream-validation.yml"
  pull_request:
    paths:
      - "vendor/**"
      - ".github/workflows/upstream-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-and-hubs:
    name: Upstream SDK and hub unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Rokid-Coder/vendor/nexus
    steps:
      - name: Check out the revision
        uses: actions/checkout@v6
        with:
          path: Rokid-Coder

      # Upstream's settings look for ../CxrGlobal; vendor/CxrGlobal links to this checkout.
      - name: Check out CxrGlobal 0.3.0
        uses: actions/checkout@v6
        with:
          repository: Anezium/CxrGlobal
          ref: v0.3.0
          path: CxrGlobal

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run the SDK and hub unit tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :shared:testDebugUnitTest \
            :bus-client:testDebugUnitTest \
            :ink-engine:test \
            :phone-core:testDebugUnitTest \
            :phone-hub:testDebugUnitTest \
            :glasses-core:testDebugUnitTest \
            :glasses-hub:testDebugUnitTest \
            --continue

      # The hub suites now run as each upstream shell plus its core. Their union must keep every
      # identity and outcome of the pre-split baseline; a new test must pass.
      - name: Check hub suite parity across the core split
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          nexus, baseline = "", "../../.github/suite-baselines/hubs.txt"
          current = {}
          for group, modules in {"phone": ["phone-hub", "phone-core"], "glasses": ["glasses-hub", "glasses-core"]}.items():
              for module in modules:
                  for report in glob.glob(f"{nexus}{module}/build/test-results/testDebugUnitTest/*.xml"):
                      for case in ET.parse(report).getroot().iter("testcase"):
                          failed = case.find("failure") is not None or case.find("error") is not None
                          skipped = case.find("skipped") is not None
                          outcome = "FAILED" if failed else ("SKIPPED" if skipped else "PASSED")
                          current[f"{group}|{case.get('classname')}#{case.get('name')}"] = outcome
          expected = {}
          for line in open(baseline):
              if line.startswith("#") or not line.strip():
                  continue
              key, outcome = line.rstrip("\n").rsplit("|", 1)
              expected[key] = outcome
          problems = [f"missing {k}" for k in expected if k not in current]
          problems += [f"changed {k}: {expected[k]} -> {current[k]}" for k in expected if k in current and current[k] != expected[k]]
          problems += [f"new test not passing {k}" for k in current if k not in expected and current[k] != "PASSED"]
          print(f"hub parity: baseline={len(expected)} current={len(current)} problems={len(problems)}")
          for problem in problems:
              print(problem)
          sys.exit(1 if problems else 0)
          PY

      - name: Check the SPP authentication files are upstream's, byte for byte
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          grep -v '^#' "../../.github/suite-baselines/spp-blobs.txt" | while read -r blob path; do
            actual="$(git hash-object "../../$path")"
            if [ "$actual" != "$blob" ]; then
              echo "$path changed: $actual != upstream $blob"
              exit 1
            fi
          done

  plugins:
    name: Upstream plugin unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vendor/nexus
    steps:
      - name: Check out the revision
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run every upstream plugin's unit tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :plugin-assistant:testDebugUnitTest \
            :plugin-relay:testDebugUnitTest \
            :plugin-lens:testDebugUnitTest \
            :plugin-lyrics:testDebugUnitTest \
            :plugin-transit:testDebugUnitTest \
            :plugin-feeds:testDebugUnitTest \
            :plugin-media:testDebugUnitTest \
            :plugin-tasker:testDebugUnitTest \
            :plugin-photosync:testDebugUnitTest \
            :plugin-wireless-adb:testDebugUnitTest \
            :plugin-sample:testDebugUnitTest \
            :plugin-nav:testDebugUnitTest \
            -PskipCxrGlobal=true \
            --continue

      - name: Check Patcher bundle preparation
        run: python3 -m unittest discover -s plugins/patcher/scripts

      - name: Run Patcher unit tests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.MORPHE_PACKAGES_TOKEN || github.token }}
        run: ./gradlew :plugin-patcher:testDebugUnitTest -PskipCxrGlobal=true
