name: Tests

# Every push and pull request runs the product suites: the computer daemon, the
# vendored Nexus SDK and hubs, and the Agents app. upstream-validation.yml covers
# the upstream modules we vendor but do not ship.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  computer:
    name: Computer and sync-script tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the revision
        uses: actions/checkout@v6

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the workspaces
        run: npm ci

      - name: Run the computer tests
        working-directory: computer
        run: npm test

      - name: Run the upstream-sync script tests
        run: node --test scripts/test/

  android:
    name: SDK, hub and Agents unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Rokid-Coder
    steps:
      - name: Check out the revision
        uses: actions/checkout@v6
        with:
          path: Rokid-Coder

      # The hubs link the CXR vendor library from the sibling checkout <repo>/../CxrGlobal.
      - name: Check out CxrGlobal 0.3.0
        uses: actions/checkout@v6
        with:
          repository: Anezium/CxrGlobal
          ref: v0.3.0
          path: CxrGlobal

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run the product unit tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :shared:test \
            :bus-client:testDebugUnitTest \
            :ink-engine:test \
            :phone-hub:testDebugUnitTest \
            :glasses-hub:testDebugUnitTest \
            :mobile:agents:testDebugUnitTest \
            --continue
