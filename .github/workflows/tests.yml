name: Tests

# Every product, script and platform suite: the repo scripts and build plugins,
# the computer daemon on Linux (which also stands for the WSL build) and macOS,
# the vendored Nexus SDK and hubs and our apps, the emulator, and 6b's Windows
# host tests. upstream-validation.yml covers the upstream modules we vendor but
# do not ship. release.yml and upstream-sync.yml call this with `ref`, the exact
# commit to test, which every called workflow checks out in turn; each job
# reports the commit it tested (`product_shas`).

on:
  # U44: feature branches run nothing; a PR into a release branch and a merge into one run the
  # Linux jobs only; release.yml (rc tags) calls this with `ref` for the full macOS/emulator/Windows
  # set, and a manual run can ask for it with `full`.
  push:
    branches: ["release/**"]
  pull_request:
    branches: ["release/**"]
  workflow_dispatch:
    inputs:
      full:
        description: "Also run the macOS, emulator and Windows jobs"
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: "The commit to test (a SHA); defaults to the event's commit"
        type: string
        default: ""
      skip-windows:
        description: "Leave 6b's Windows workflow to the caller (release.yml runs it itself, for its artifact)"
        type: boolean
        default: false
    outputs:
      product_shas:
        description: "job=commit, one per job, for the commit each job tested"
        value: |
          scripts=${{ jobs.scripts.outputs.sha }}
          computer-ubuntu-latest=${{ jobs.computer.outputs.ubuntu-latest }}
          computer-macos-latest=${{ jobs.computer.outputs.macos-latest }}
          android=${{ jobs.android.outputs.sha }}
          ${{ jobs.emulator.outputs.product_shas }}
          ${{ jobs.windows.outputs.product_shas }}
      dependency_shas:
        description: "job=commit for the dependency checkouts (CxrGlobal)"
        value: |
          android-cxrglobal=${{ jobs.android.outputs.cxrglobal }}
          ${{ jobs.emulator.outputs.dependency_shas }}

permissions:
  contents: read

concurrency:
  group: tests-${{ inputs.ref || github.ref }}
  # A called run tests one fixed commit for its caller: never cancelled by a newer push.
  cancel-in-progress: ${{ !inputs.ref }}

env:
  CXRGLOBAL_SHA: 395be12ef69cf7d46d67c526168b78392a0b5484

jobs:
  scripts:
    name: Repo scripts, build plugins and workflow lint
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.tested.outputs.sha }}
    env:
      ACTIONLINT_VERSION: "1.7.7"
      # From actionlint_1.7.7_checksums.txt in the v1.7.7 release (the linux_amd64 tarball).
      ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
    steps:
      - name: Check out the revision
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Record the tested commit
        id: tested
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install actionlint
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$tarball" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          [[ "$ACTIONLINT_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "ACTIONLINT_SHA256 is not a SHA-256 digest; verify it for $ACTIONLINT_VERSION"; exit 1; }
          echo "$ACTIONLINT_SHA256  $tarball" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          rm "$tarball"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Includes the release gate, publish, version, upstream-sync and workflow checks.
      - name: Run the script tests
        run: node --test "scripts/test/*.test.mjs" "scripts/test/*.test.js"

      - name: Check the docs for secrets and full fingerprints
        run: node scripts/check-docs-secrets.mjs

      - name: Run the build plugins' unit and TestKit tests
        run: ./gradlew -p build-logic test

      - name: Lint every workflow
        run: actionlint -shellcheck= -pyflakes= .github/workflows/*.yml

  computer:
    name: Computer tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS only for a release (called with ref) or a manual full run: its minutes count 10x.
        os: ${{ (inputs.ref || inputs.full) && fromJSON('["ubuntu-latest","macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    outputs:
      ubuntu-latest: ${{ steps.tested.outputs.ubuntu-latest }}
      macos-latest: ${{ steps.tested.outputs.macos-latest }}
    steps:
      - name: Check out the revision
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Record the tested commit
        id: tested
        env:
          CELL: ${{ matrix.os }}
        run: echo "$CELL=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the workspaces
        run: npm ci

      - name: Check every locked registry package is pinned by digest
        working-directory: computer
        run: npm run check:lockfile

      - name: Run the computer tests
        working-directory: computer
        run: npm test

  android:
    name: SDK, hub and app unit tests
    runs-on: ubuntu-latest
    # A hung suite ends here, not at the 6-hour default.
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.tested.outputs.sha }}
      cxrglobal: ${{ steps.tested.outputs.cxrglobal }}
    defaults:
      run:
        working-directory: Rokid-Coder
    steps:
      - name: Check out the revision
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          path: Rokid-Coder

      # The hubs link the CXR vendor library from the sibling checkout <repo>/../CxrGlobal.
      - name: Check out CxrGlobal 0.3.0
        uses: actions/checkout@v6
        with:
          repository: Anezium/CxrGlobal
          ref: ${{ env.CXRGLOBAL_SHA }}
          path: CxrGlobal

      - name: Record the tested commits
        id: tested
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "cxrglobal=$(git -C ../CxrGlobal rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # --continue runs every suite; check-test-results then judges them, allowing only the two
      # known GlassesFileStoreTest failures by name.
      - name: Run the product unit tests
        shell: bash
        run: |
          set -uo pipefail
          ./gradlew \
            :shared:test \
            :bus-client:testDebugUnitTest \
            :ink-engine:test \
            :phone-core:testDebugUnitTest \
            :phone-hub:testDebugUnitTest \
            :glasses-core:testDebugUnitTest \
            :glasses-hub:testDebugUnitTest \
            :glasses-app:testDebugUnitTest \
            :mobile:app:testDebugUnitTest \
            --continue || echo "Gradle reported failures; check-test-results judges them."

      - name: Check the test results
        shell: bash
        run: |
          node scripts/check-test-results.mjs \
            vendor/nexus/shared/build/test-results/test \
            vendor/nexus/bus-client/build/test-results/testDebugUnitTest \
            vendor/nexus/ink-engine/build/test-results/test \
            vendor/nexus/phone-core/build/test-results/testDebugUnitTest \
            vendor/nexus/phone-hub/build/test-results/testDebugUnitTest \
            vendor/nexus/glasses-core/build/test-results/testDebugUnitTest \
            vendor/nexus/glasses-hub/build/test-results/testDebugUnitTest \
            glasses/app/build/test-results/testDebugUnitTest \
            mobile/app/build/test-results/testDebugUnitTest

      # The hub suites now run as each upstream shell plus its core. Their union must keep every
      # identity and outcome of the pre-split baseline; a new test must pass.
      - name: Check hub suite parity across the core split
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          nexus, baseline = "vendor/nexus/", ".github/suite-baselines/hubs.txt"
          current = {}
          for group, modules in {"phone": ["phone-hub", "phone-core"], "glasses": ["glasses-hub", "glasses-core"]}.items():
              for module in modules:
                  for report in glob.glob(f"{nexus}{module}/build/test-results/testDebugUnitTest/*.xml"):
                      for case in ET.parse(report).getroot().iter("testcase"):
                          failed = case.find("failure") is not None or case.find("error") is not None
                          skipped = case.find("skipped") is not None
                          outcome = "FAILED" if failed else ("SKIPPED" if skipped else "PASSED")
                          current[f"{group}|{case.get('classname')}#{case.get('name')}"] = outcome
          expected = {}
          for line in open(baseline):
              if line.startswith("#") or not line.strip():
                  continue
              key, outcome = line.rstrip("\n").rsplit("|", 1)
              expected[key] = outcome
          # The two GlassesFileStoreTest failures check-test-results allows: they fail on macOS and
          # pass on Linux, so either outcome keeps parity. Every other identity must match exactly.
          store = "glasses|com.anezium.rokidbus.glasses.GlassesFileStoreTest#"
          either = {
              f"{store}a file swapped for a folder at the final boundary is not removed",
              f"{store}a folder swapped for a file at the final boundary is not removed",
          }
          def same(k):
              if k in either:
                  return current[k] in ("FAILED", "PASSED")
              return current[k] == expected[k]
          problems = [f"missing {k}" for k in expected if k not in current]
          problems += [f"changed {k}: {expected[k]} -> {current[k]}" for k in expected if k in current and not same(k)]
          problems += [f"new test not passing {k}" for k in current if k not in expected and current[k] != "PASSED"]
          print(f"hub parity: baseline={len(expected)} current={len(current)} problems={len(problems)}")
          for problem in problems:
              print(problem)
          sys.exit(1 if problems else 0)
          PY

      - name: Check the SPP authentication files are upstream's, byte for byte
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          grep -v '^#' ".github/suite-baselines/spp-blobs.txt" | while read -r blob path; do
            actual="$(git hash-object "$path")"
            if [ "$actual" != "$blob" ]; then
              echo "$path changed: $actual != upstream $blob"
              exit 1
            fi
          done

  emulator:
    name: Emulator
    if: ${{ inputs.ref || inputs.full }}
    uses: ./.github/workflows/emulator.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  # Hosted Windows runners cannot run WSL2, and on Windows agentd runs inside WSL (R4): the Linux
  # build of the computer suite runs on ubuntu above, and the Windows host's own code (Pester and
  # the mocked-wsl.exe node tests) runs here.
  windows:
    name: Windows
    if: ${{ (inputs.ref || inputs.full) && !inputs.skip-windows }}
    uses: ./.github/workflows/windows-installer.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
